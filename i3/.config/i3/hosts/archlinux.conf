# Desktop: never blank or power down the screen, and never lock on idle. X
# defaults to blanking after 10 minutes with DPMS on top; xss-lock listens for
# that same screensaver signal, so the single timer was both turning the
# screen off and locking it. Disabling it stops both -- the only lock left is
# $mod+q. Requires xorg-xset.
exec --no-startup-id xset s off -dpms

# Wallpaper. The path is passed twice on purpose: with two monitors, feh maps
# one argument per screen. Given once instead, it stretches a single copy over
# the whole 3840x1080 root window, and filling a 32:9 area from a 16:9 image
# crops the sky and the foreground away. Once per screen means each 1920x1080
# monitor gets an exact 2x downscale of the 3840x2160 source -- no crop, no
# distortion. Add another copy of the path if a third monitor appears.
exec --no-startup-id feh --no-fehbg --bg-fill ~/Pictures/wallpapers/mountain.png ~/Pictures/wallpapers/mountain.png
