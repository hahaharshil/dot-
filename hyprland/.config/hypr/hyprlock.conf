# hyprlock: the lock screen.

background {
    color = rgb(1a1a1a)   # plain dark background
}

# Big clock in the middle
label {
    text = $TIME
    font_size = 64
    font_family = JetBrainsMono Nerd Font
    color = rgb(dddddd)
    position = 0, 80
    halign = center
    valign = center
}

# Password box below it
input-field {
    size = 250, 45
    outer_color = rgb(33ccff)
    inner_color = rgb(2a2a2a)
    font_color = rgb(dddddd)
    placeholder_text = password
    position = 0, -40
    halign = center
    valign = center
}
