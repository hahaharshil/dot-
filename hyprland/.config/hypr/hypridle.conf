# hypridle: what happens when you stop using the computer.

general {
    lock_cmd = pidof hyprlock || hyprlock        # lock, but never start a second hyprlock
    before_sleep_cmd = loginctl lock-session      # lock before suspend
    after_sleep_cmd = hyprctl dispatch dpms on    # turn screen back on after waking
}

# 5 min idle -> lock
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# 6 min idle -> screen off (on again when you touch something)
listener {
    timeout = 360
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

# 15 min idle -> suspend
listener {
    timeout = 900
    on-timeout = systemctl suspend
}
