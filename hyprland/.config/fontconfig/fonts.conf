<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  System-wide default fonts for this user. Apps that ask for a generic
  "sans-serif", "serif" or "monospace" font (hyprlauncher, Hyprland pop-ups,
  GTK apps, web pages that don't pick their own font) get JetBrainsMono
  Nerd Font, so everything matches kitty and waybar.
  binding="strong" is needed: without it fontconfig ranks a language match
  above our preference and keeps picking FreeSans.
  Check with: fc-match sans-serif
-->
<fontconfig>
  <alias binding="strong">
    <family>sans-serif</family>
    <prefer><family>JetBrainsMono Nerd Font</family></prefer>
  </alias>
  <alias binding="strong">
    <family>serif</family>
    <prefer><family>JetBrainsMono Nerd Font</family></prefer>
  </alias>
  <alias binding="strong">
    <family>monospace</family>
    <prefer><family>JetBrainsMono Nerd Font</family></prefer>
  </alias>
</fontconfig>
